# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - TheRoofingCRM

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Package standalone server
        run: |
          test -f .next/standalone/server.js
          mkdir -p deploy
          cp -a .next/standalone/. deploy/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          include-hidden-files: true

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8C3F71A27F2C405AB34D91B39F3C2FFC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_375069650E1048208FBEA8FA9BDDE38E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7BAF75E7F2234D2DBD602A02A707B968 }}

      - name: Run the standalone server without a second npm build
        run: |
          set -euo pipefail
          rg=$(az webapp list --query "[?name=='TheRoofingCRM'].resourceGroup | [0]" -o tsv)
          if [ -z "$rg" ]; then
            echo "TheRoofingCRM was not found in this subscription."
            exit 1
          fi
          az webapp config set --name TheRoofingCRM --resource-group "$rg" --startup-file "node server.js"
          az webapp config appsettings set --name TheRoofingCRM --resource-group "$rg" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TheRoofingCRM'
          slot-name: 'Production'
          package: .
          