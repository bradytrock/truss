# Warnings should land inside a few minutes. The 15-minute automation cron
# stays on its own schedule so it does not run three times as often.
name: Storm weather

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the storm cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://myroofingtools.com
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Add repository secret CRON_SECRET (same value as App Service)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/weather"
          echo
